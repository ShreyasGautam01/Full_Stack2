name: LociCanvas CI

on:
  pull_request:
    paths:
      - "Experiment2/CaseStudy/locicanvas/**"
      - ".github/workflows/locicanvas-ci.yml"
  push:
    branches:
      - main
    paths:
      - "Experiment2/CaseStudy/locicanvas/**"
      - ".github/workflows/locicanvas-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Experiment2/CaseStudy/locicanvas
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Experiment2/CaseStudy/locicanvas/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run domain tests
        run: npm test

      - name: Check lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
